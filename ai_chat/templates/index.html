<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ASAS – בינה מלאכותית בעברית</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1e293b;
      padding: 0.75rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      flex-shrink: 0;
    }

    header h1 { font-size: 1.2rem; font-weight: 700; color: #38bdf8; }

    #status-badge {
      font-size: 0.75rem;
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      background: #334155;
      color: #94a3b8;
    }
    #status-badge.ok  { background: #166534; color: #86efac; }
    #status-badge.err { background: #7f1d1d; color: #fca5a5; }

    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .msg {
      max-width: 75%;
      padding: 0.65rem 0.9rem;
      border-radius: 0.75rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .msg.user {
      background: #1d4ed8;
      align-self: flex-end;
      border-bottom-left-radius: 0.2rem;
    }

    .msg.assistant {
      background: #1e293b;
      border: 1px solid #334155;
      align-self: flex-start;
      border-bottom-right-radius: 0.2rem;
    }

    .msg.error { background: #7f1d1d; border-color: #ef4444; align-self: flex-start; }

    .msg .sender {
      font-size: 0.7rem;
      font-weight: 600;
      margin-bottom: 0.25rem;
      opacity: 0.7;
      text-transform: uppercase;
    }

    #typing-indicator {
      display: none;
      align-self: flex-start;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 0.75rem;
      padding: 0.65rem 0.9rem;
      color: #94a3b8;
      font-style: italic;
    }

    footer {
      background: #1e293b;
      border-top: 1px solid #334155;
      padding: 0.75rem 1.5rem;
      flex-shrink: 0;
    }

    #input-row {
      display: flex;
      gap: 0.5rem;
    }

    #user-input {
      flex: 1;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 0.5rem;
      color: #e2e8f0;
      padding: 0.6rem 0.85rem;
      font-size: 1rem;
      font-family: inherit;
      resize: none;
      outline: none;
      transition: border-color 0.15s;
    }
    #user-input:focus { border-color: #38bdf8; }

    button {
      background: #0369a1;
      color: #fff;
      border: none;
      border-radius: 0.5rem;
      padding: 0.6rem 1.1rem;
      font-size: 0.95rem;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    button:hover { background: #0284c7; }
    button:disabled { background: #334155; cursor: not-allowed; }

    #clear-btn { background: #475569; }
    #clear-btn:hover { background: #64748b; }

    #hint {
      font-size: 0.72rem;
      color: #64748b;
      margin-top: 0.4rem;
      text-align: center;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body>

<header>
  <h1>🤖 ASAS – בינה מלאכותית בעברית</h1>
  <span id="status-badge">בודק...</span>
</header>

<div id="chat-box">
  <div id="typing-indicator">הבינה המלאכותית מקלידה...</div>
</div>

<footer>
  <div id="input-row">
    <textarea
      id="user-input"
      rows="2"
      placeholder="כתוב הודעה... (Enter לשליחה, Shift+Enter לשורה חדשה)"
      autofocus
    ></textarea>
    <button id="send-btn">שלח</button>
    <button id="clear-btn" title="נקה שיחה" aria-label="נקה שיחה">🗑️</button>
  </div>
  <p id="hint">Enter – שלח &nbsp;|&nbsp; Shift+Enter – שורה חדשה</p>
</footer>

<script>
  const chatBox   = document.getElementById('chat-box');
  const input     = document.getElementById('user-input');
  const sendBtn   = document.getElementById('send-btn');
  const clearBtn  = document.getElementById('clear-btn');
  const statusEl  = document.getElementById('status-badge');
  const typingEl  = document.getElementById('typing-indicator');

  // ── Status check ──────────────────────────────────────────────────────────
  async function checkStatus() {
    try {
      const res  = await fetch('/api/status');
      const data = await res.json();
      if (data.model_loaded) {
        statusEl.textContent = '✅ מודל טעון';
        statusEl.className   = 'ok';
      } else if (!data.llama_available) {
        statusEl.textContent = '⚠️ llama-cpp-python חסר';
        statusEl.className   = 'err';
      } else {
        statusEl.textContent = '⚠️ מודל לא נמצא';
        statusEl.className   = 'err';
      }
    } catch {
      statusEl.textContent = '❌ שגיאת חיבור';
      statusEl.className   = 'err';
    }
  }
  checkStatus();

  // ── Load history ──────────────────────────────────────────────────────────
  async function loadHistory() {
    try {
      const res  = await fetch('/api/history');
      const hist = await res.json();
      hist.forEach(turn => {
        appendMsg('אתה', turn.user, 'user');
        appendMsg('עוזר', turn.assistant, 'assistant');
      });
    } catch { /* ignore */ }
  }
  loadHistory();

  // ── Helpers ───────────────────────────────────────────────────────────────
  function appendMsg(sender, text, cls) {
    const div = document.createElement('div');
    div.className = `msg ${cls}`;
    div.innerHTML = `<div class="sender">${sender}</div>${escHtml(text)}`;
    chatBox.insertBefore(div, typingEl);
    chatBox.scrollTop = chatBox.scrollHeight;
    return div;
  }

  function escHtml(str) {
    return str
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function setLoading(val) {
    sendBtn.disabled  = val;
    input.disabled    = val;
    typingEl.style.display = val ? 'block' : 'none';
    if (val) chatBox.scrollTop = chatBox.scrollHeight;
  }

  // ── Send message ──────────────────────────────────────────────────────────
  async function sendMessage() {
    const text = input.value.trim();
    if (!text) return;

    appendMsg('אתה', text, 'user');
    input.value = '';
    input.style.height = 'auto';
    setLoading(true);

    try {
      const res  = await fetch('/api/chat', {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ message: text }),
      });
      const data = await res.json();
      if (res.ok) {
        appendMsg('עוזר', data.reply, 'assistant');
      } else {
        appendMsg('שגיאה', data.error || 'שגיאה לא ידועה', 'error');
      }
    } catch (err) {
      appendMsg('שגיאה', `שגיאת רשת: ${err.message}`, 'error');
    } finally {
      setLoading(false);
      input.focus();
    }
  }

  // ── Clear history ─────────────────────────────────────────────────────────
  async function clearHistory() {
    if (!confirm('למחוק את כל היסטוריית השיחה?')) return;
    await fetch('/api/clear', { method: 'POST' });
    Array.from(chatBox.querySelectorAll('.msg')).forEach(el => el.remove());
  }

  // ── Event listeners ───────────────────────────────────────────────────────
  sendBtn.addEventListener('click', sendMessage);
  clearBtn.addEventListener('click', clearHistory);

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // Auto-resize textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 160) + 'px';
  });
</script>
</body>
</html>
