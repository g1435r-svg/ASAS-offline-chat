name: Build Offline Windows Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai_chat/requirements.txt

      - name: Install application dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade setuptools wheel cmake ninja
          python -m pip install pyinstaller flask colorama
          $env:CMAKE_ARGS = "-DGGML_NATIVE=OFF"
          python -m pip install --prefer-binary --no-cache-dir llama-cpp-python

      - name: Build Windows application
        shell: pwsh
        run: python -m PyInstaller --noconfirm ASAS.spec

      - name: Download default offline model
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\ASAS\models | Out-Null
          Invoke-WebRequest -UseBasicParsing `
            -Uri "https://huggingface.co/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q8_0.gguf" `
            -OutFile "dist\ASAS\models\Llama-3.2-1B-Instruct-Q8_0.gguf"

      - name: Validate portable package
        shell: pwsh
        run: |
          $required = @(
            "dist\ASAS\ASAS.exe",
            "dist\ASAS\ASAS_server.exe",
            "dist\ASAS\ASAS_cli.exe",
            "dist\ASAS\models\Llama-3.2-1B-Instruct-Q8_0.gguf"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing required file: $path" }
          }
          $model = Get-Item "dist\ASAS\models\Llama-3.2-1B-Instruct-Q8_0.gguf"
          if ($model.Length -lt 100MB) { throw "Model download is incomplete: $($model.Length) bytes" }
          Write-Host "Validated model: $([math]::Round($model.Length / 1GB, 2)) GB"

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\ASAS -DestinationPath ASAS-offline-windows.zip -CompressionLevel Optimal

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: ASAS-offline-windows
          path: ASAS-offline-windows.zip
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v') && success()
        uses: softprops/action-gh-release@v2
        with:
          files: ASAS-offline-windows.zip
