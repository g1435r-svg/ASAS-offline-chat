name: Build Offline Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai_chat/requirements.txt

      - name: Install application dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller flask colorama
          python -m pip install llama-cpp-python --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Build Windows application
        shell: pwsh
        run: python -m PyInstaller --noconfirm ASAS.spec

      - name: Download offline models
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist\ASAS\models | Out-Null
          Invoke-WebRequest `
            -Uri "https://huggingface.co/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q8_0.gguf" `
            -OutFile "dist\ASAS\models\Llama-3.2-1B-Instruct-Q8_0.gguf"
          Invoke-WebRequest `
            -Uri "https://huggingface.co/TheBloke/Mistral-7B-Instruct-v0.2-GGUF/resolve/main/mistral-7b-instruct-v0.2.Q4_K_M.gguf" `
            -OutFile "dist\ASAS\models\mistral-7b-instruct-v0.2.Q4_K_M.gguf"

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path dist\ASAS\* -DestinationPath ASAS-offline-windows.zip

      - name: Upload portable application
        uses: actions/upload-artifact@v4
        with:
          name: ASAS-offline-windows
          path: ASAS-offline-windows.zip
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ASAS-offline-windows.zip
